name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Core
        run: bun --cwd packages/core tsc --noEmit

      - name: Typecheck CLI
        run: bun --cwd packages/cli tsc --noEmit

      - name: Typecheck MCP
        run: bun --cwd packages/mcp tsc --noEmit

      - name: Typecheck Web
        run: bun --cwd packages/web tsc --noEmit

  test:
    name: Monorepo Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install LibreOffice & WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-weasyprint fonts-liberation

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Monorepo Tests (Unit & E2E)
        run: bun test

      - name: Verify CLI Doctor Diagnostic
        run: bun run packages/cli/src/index.ts doctor

  build:
    name: Production Build Verification
    needs: [typecheck-and-lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Studio
        run: bun run --cwd packages/web build
